basePath: /
definitions:
  handlers.AuthRequest:
    properties:
      email:
        type: string
      password:
        maxLength: 25
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  handlers.AuthResponse:
    properties:
      jwt:
        type: string
    type: object
  handlers.CartItemResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      price:
        description: Price in cents
        type: integer
      quantity:
        type: integer
      stock:
        type: integer
    type: object
  handlers.CartOffsetResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handlers.CartItemResponse'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      user_id:
        type: integer
    type: object
  handlers.ErrorDetail:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      details:
        items:
          $ref: '#/definitions/handlers.ErrorDetail'
        type: array
      error:
        type: string
      message:
        type: string
    type: object
  handlers.UpsertCartItemRequest:
    properties:
      quantity:
        type: integer
    required:
    - quantity
    type: object
  models.Item:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      price:
        description: Price in cents
        type: integer
      stock:
        type: integer
    type: object
  services.ItemCursorResult:
    properties:
      has_more:
        type: boolean
      items:
        items:
          $ref: '#/definitions/models.Item'
        type: array
      next_cursor:
        type: string
    type: object
  services.ItemOffsetResult:
    properties:
      items:
        items:
          $ref: '#/definitions/models.Item'
        type: array
      limit:
        type: integer
      offset:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for items, cart, orders and authentication.
  title: Checkout API
  version: "1.0"
paths:
  /auth/refresh:
    post:
      description: Rotates the refresh token stored in the HttpOnly cookie and returns
        a new access token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Refresh access token
      tags:
      - Auth
  /items:
    get:
      description: Returns items using offset-based pagination.
      parameters:
      - default: 10
        description: Maximum number of items to return
        in: query
        name: limit
        type: integer
      - default: 0
        description: Number of items to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.ItemOffsetResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: List items
      tags:
      - Items
  /items/{item_id}:
    get:
      description: Returns a single item by its ID.
      parameters:
      - description: Item ID
        in: path
        name: item_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Item'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Get item by ID
      tags:
      - Items
  /items/cursor:
    get:
      description: Returns items after the supplied cursor. Use next_cursor from the
        previous response to retrieve the next page.
      parameters:
      - default: 10
        description: Maximum number of items to return
        in: query
        name: limit
        type: integer
      - description: Cursor returned by the previous page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.ItemCursorResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: List items using cursor pagination
      tags:
      - Items
  /login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns an access token. A refresh token
        is stored in an HttpOnly cookie.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.AuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Login user
      tags:
      - Auth
  /signup:
    post:
      consumes:
      - application/json
      description: Registers a new user.
      parameters:
      - description: User registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.AuthRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Create user
      tags:
      - Auth
  /user/cart:
    get:
      description: Returns cart items using offset-based pagination.
      parameters:
      - default: 10
        description: Maximum number of cart items to return
        in: query
        name: limit
        type: integer
      - default: 0
        description: Number of cart items to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CartOffsetResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user's cart
      tags:
      - Cart
  /user/cart/items/{item_id}:
    delete:
      description: Removes an item from the current user's cart.
      parameters:
      - description: Item ID
        in: path
        name: item_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Cart item removed successfully
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove item from cart
      tags:
      - Cart
    patch:
      consumes:
      - application/json
      description: Adds an item to the current user's cart or updates its quantity.
      parameters:
      - description: Item ID
        in: path
        name: item_id
        required: true
        type: integer
      - description: Cart item quantity
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpsertCartItemRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Cart item updated successfully
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add or update cart item
      tags:
      - Cart
swagger: "2.0"
