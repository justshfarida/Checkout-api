stages:
  - format
  - security
  - test
  - build
  - docker
  - scan

format:
  stage: format
  image: golang:1.26.10

  script:
    - test -z "$(gofmt -l .)"

# --- Security: block on known CVEs and leaked secrets; gosec reports only for now.
govulncheck:
  stage: security
  image: golang:1.26.10
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - govulncheck ./...            # non-zero exit on a reachable vulnerability -> blocks

gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0                   # full history of this branch, not just the last commits
  script:
    # HEAD = this branch's history only (not every student's branch).
    # Accepted findings are listed with a reason in .gitleaksignore.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - gitleaks detect --source . --log-opts="HEAD" --redact -v

gosec:
  stage: security
  image: golang:1.26.10
  script:
    - go install github.com/securego/gosec/v2/cmd/gosec@latest
    - gosec -severity medium ./...
  allow_failure: true              # reporting only until 2026-11-01, then blocking

unit_tests:
  stage: test
  image: golang:1.26.10

  script:
    - go test -race ./...
    - go test -coverprofile=coverage.out ./internal/services
    - go tool cover -func=coverage.out
    - |
      COVERAGE=$(go tool cover -func=coverage.out | awk '/total:/ {print $3}' | tr -d '%')
      echo "Business logic coverage: ${COVERAGE}%"
      awk "BEGIN { if ($COVERAGE < 60) exit 1 }"

  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'

  artifacts:
    when: always
    paths:
      - coverage.out

build:
  stage: build
  image: golang:1.26.10

  script:
    - go build ./...

docker:
  stage: docker
  image: docker:24

  services:
    - docker:24-dind

  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"

# Scan the image we just pushed: OS packages, the Go binary, misconfig.
# Fails the pipeline on any CRITICAL vulnerability.
trivy:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - trivy image --exit-code 1 --severity CRITICAL --no-progress "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - trivy image --exit-code 0 --severity HIGH --no-progress "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"   # report only
