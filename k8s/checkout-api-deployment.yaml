apiVersion: apps/v1
kind: Deployment

metadata:
  name: checkout-api
  namespace: workshop

spec:
  replicas: 1

  selector:
    matchLabels:
      app: checkout-api

  template:
    metadata:
      labels:
        app: checkout-api

    spec:
      containers:
        - name: checkout-api
          image: farida-checkout-api-app:latest
          # Do not download/pull this image from a registry. Only use a copy that already exists on the Kubernetes node.
          imagePullPolicy: Never


          ports:
            - containerPort: 8080
          env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: checkout-secret
                key: DATABASE_URL

          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: checkout-secret
                key: JWT_SECRET

          - name: FRONTEND_URL
            valueFrom:
              configMapKeyRef:
                name: checkout-config
                key: FRONTEND_URL